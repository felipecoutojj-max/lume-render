<title>Lume Render</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: viewport à esquerda ocupando a tela, bancada de controles à direita (empilha no celular). Um só tema escuro, de propósito: render se julga sobre fundo neutro escuro. */
:root{
  --ground:#14130f; --panel:#1c1a16; --card:#232019; --line:#2e2b25;
  --ink:#ece6da; --muted:#9a9284; --bronze:#c4884a; --bronze-ink:#1a1209;
  --ok:#8fb07a; --warn:#d9a441;
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.mark{font:400 28px/1 var(--f-display);letter-spacing:.01em}
.mark i{color:var(--bronze)}
.file{display:flex;flex-direction:column;min-width:0;flex:1}
.file b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file span{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink);font-weight:600}
.btn.primary:hover{background:#d39859}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#111}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:16px;bottom:14px;right:16px;font:12px var(--f-mono);color:rgba(236,230,218,.6);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.drop{position:absolute;inset:12px;border:2px dashed var(--bronze);border-radius:10px;display:grid;place-items:center;background:rgba(20,19,15,.6);font:400 30px var(--f-display);color:var(--ink)}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,19,15,.72);text-align:center;padding:16px}
.busy p{font:400 26px var(--f-display);margin:0}
.busy small{display:block;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
details.sec{border-bottom:1px solid var(--line)}
details.sec:last-child{border-bottom:0}
details.sec>summary{list-style:none;cursor:pointer;padding-block:14px;display:flex;justify-content:space-between;align-items:center;font:500 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font:400 16px var(--f-mono);letter-spacing:0}
details.sec[open]>summary::after{content:"–"}
.body{display:grid;gap:12px;padding-bottom:16px}
.flat{padding-bottom:0}
.sub{font:500 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{background:none;border:0;padding:0;cursor:pointer;display:grid;gap:3px;justify-items:center;align-content:start;color:var(--muted);font-size:10.5px;line-height:1.2;text-align:center}
.sw img{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;border:2px solid transparent;transition:border-color .15s;background:#22201b}
.sw[aria-pressed="true"] img{border-color:var(--bronze)}
.sw[aria-pressed="true"]{color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.val{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rng{display:grid;gap:2px}
.rng .row label{font-size:13px}
input[type=range]{width:100%;accent-color:var(--bronze);margin:0}
input[type=checkbox]{accent-color:var(--bronze);width:16px;height:16px;margin:0}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--bronze);color:var(--bronze)}
.bgchip{display:flex;align-items:center;gap:6px}
.bgchip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.15)}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:4px;background:none;padding:0;cursor:pointer}
select{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--muted);margin:0}
.status{font:12px var(--f-mono);color:var(--muted);min-height:1.4em;margin:0}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.sample-tag{display:inline-block;font:11px var(--f-mono);color:var(--bronze);border:1px solid rgba(196,136,74,.45);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.lights{display:grid;gap:10px}
.light{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.lhead{display:flex;align-items:center;gap:8px}
.lhead b{flex:1;font-weight:500;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead select{width:auto;padding:4px 6px;font-size:12.5px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px}
.x:hover{color:var(--ink)}

@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="mark">Lu<i>m</i>e</div>
    <div class="file">
      <b id="fileName">Estudo orgânico <span class="sample-tag">exemplo</span></b>
      <span id="stats">—</span>
    </div>
    <input id="fileInput" type="file" accept=".obj,.ply,.stl" hidden>
    <button class="btn primary" id="openBtn">Abrir escultura</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hint" id="hint">Arraste para girar · role para aproximar · botão direito move · solte um OBJ, PLY ou STL aqui</div>
    <div class="drop" id="drop" hidden>Solte para abrir</div>
    <div class="busy" id="busy" hidden><div><p id="busyMsg">Lendo arquivo…</p><small id="busySub"></small></div></div>
  </main>

  <aside class="panel" aria-label="Controles de render">
    <details class="sec" open>
      <summary>Material</summary>
      <div class="body">
        <div class="chips" id="matMode">
          <button class="chip" data-mode="pbr" aria-pressed="true">Realista</button>
          <button class="chip" data-mode="matcap" aria-pressed="false">Estilo ZBrush</button>
        </div>
        <div class="body flat" id="swPbr"></div>
        <div class="swatches" id="swMatcap" hidden></div>
        <div id="matAdjust" class="body flat">
          <div class="sub">Ajustar o material</div>
          <div class="colors"><label>Cor <input type="color" id="mColor"></label></div>
          <div class="rng"><div class="row"><label for="mRough">Rugosidade</label><span class="val" id="mRoughv"></span></div><input type="range" id="mRough" min="0.02" max="1" step="0.01"></div>
          <div class="rng"><div class="row"><label for="mMetal">Metal</label><span class="val" id="mMetalv"></span></div><input type="range" id="mMetal" min="0" max="1" step="0.01"></div>
          <div class="rng"><div class="row"><label for="mCoat">Verniz</label><span class="val" id="mCoatv"></span></div><input type="range" id="mCoat" min="0" max="1" step="0.01"></div>
          <div class="sub">Superfície real</div>
          <div class="rng"><div class="row"><label for="mBump">Microtextura</label><span class="val" id="mBumpv"></span></div><input type="range" id="mBump" min="0" max="1" step="0.01"></div>
          <div class="rng"><div class="row"><label for="mVar">Variação de cor</label><span class="val" id="mVarv"></span></div><input type="range" id="mVar" min="0" max="1" step="0.01"></div>
          <div class="rng"><div class="row"><label for="mFreq">Tamanho do grão</label><span class="val" id="mFreqv"></span></div><input type="range" id="mFreq" min="0" max="1" step="0.01"></div>
        </div>
        <label class="check" id="ppWrap" hidden><input type="checkbox" id="pp"> Usar polypaint (cores do ZBrush)</label>
      </div>
    </details>

    <details class="sec" open>
      <summary>Luzes</summary>
      <div class="body">
        <div class="chips" id="rigs"></div>
        <div class="rng"><div class="row"><label for="rigRot">Girar todas as luzes</label><span class="val" id="rigRotv"></span></div><input type="range" id="rigRot" min="-180" max="180" step="1" value="0"></div>
        <div class="rng"><div class="row"><label for="envI">Reflexos do ambiente</label><span class="val" id="envIv"></span></div><input type="range" id="envI" min="0" max="1.5" step="0.01" value="0.5"></div>
        <div class="lights" id="lights"></div>
        <div class="row">
          <button class="btn small" id="addLight">+ Adicionar ponto de luz</button>
          <label class="check"><input type="checkbox" id="showL" checked> Ver luzes</label>
        </div>
      </div>
    </details>

    <details class="sec" open>
      <summary>Acabamento fotográfico</summary>
      <div class="body">
        <div class="chips" id="looks"></div>
        <div class="rng"><div class="row"><label for="fExp">Exposição</label><span class="val" id="fExpv"></span></div><input type="range" id="fExp" min="0.3" max="2.5" step="0.01"></div>
        <div class="rng"><div class="row"><label for="fCon">Contraste</label><span class="val" id="fConv"></span></div><input type="range" id="fCon" min="0.7" max="1.5" step="0.01"></div>
        <div class="rng"><div class="row"><label for="fSat">Saturação</label><span class="val" id="fSatv"></span></div><input type="range" id="fSat" min="0" max="1.6" step="0.01"></div>
        <div class="rng"><div class="row"><label for="fWarm">Temperatura</label><span class="val" id="fWarmv"></span></div><input type="range" id="fWarm" min="-1" max="1" step="0.01"></div>
        <div class="rng"><div class="row"><label for="fBloom">Brilho nos reflexos</label><span class="val" id="fBloomv"></span></div><input type="range" id="fBloom" min="0" max="1" step="0.01"></div>
        <div class="rng"><div class="row"><label for="fVig">Vinheta</label><span class="val" id="fVigv"></span></div><input type="range" id="fVig" min="0" max="1" step="0.01"></div>
        <div class="rng"><div class="row"><label for="fGrain">Granulação de filme</label><span class="val" id="fGrainv"></span></div><input type="range" id="fGrain" min="0" max="1" step="0.01"></div>
        <label class="check"><input type="checkbox" id="aoOn" checked> Oclusão de ambiente</label>
        <div class="rng"><div class="row"><label for="aoR">Profundidade das cavidades</label><span class="val" id="aoRv"></span></div><input type="range" id="aoR" min="0.02" max="0.4" step="0.01" value="0.12"></div>
        <label class="check"><input type="checkbox" id="dofOn"> Profundidade de campo (foco)</label>
        <div class="rng"><div class="row"><label for="dofA">Desfoque do fundo</label><span class="val" id="dofAv"></span></div><input type="range" id="dofA" min="0" max="1" step="0.01" value="0.35"></div>
      </div>
    </details>

    <details class="sec">
      <summary>Chão e fundo</summary>
      <div class="body">
        <label class="check"><input type="checkbox" id="shOn" checked> Sombra no chão</label>
        <div class="rng"><div class="row"><label for="shA">Força da sombra</label><span class="val" id="shAv"></span></div><input type="range" id="shA" min="0" max="0.95" step="0.01" value="0.55"></div>
        <div class="chips" id="bgPresets"></div>
        <div class="colors">
          <label>Topo <input type="color" id="bgTop" value="#3b3a37"></label>
          <label>Base <input type="color" id="bgBot" value="#111111"></label>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary>Câmera</summary>
      <div class="body">
        <div class="chips" id="views">
          <button class="chip" data-az="0">Frente</button>
          <button class="chip" data-az="35">Três quartos</button>
          <button class="chip" data-az="90">Perfil</button>
          <button class="chip" data-az="180">Costas</button>
        </div>
        <div class="rng"><div class="row"><label for="fov">Lente</label><span class="val" id="fovv"></span></div><input type="range" id="fov" min="8" max="60" step="1" value="24"></div>
        <label class="check"><input type="checkbox" id="spin"> Girar no pedestal</label>
      </div>
    </details>

    <details class="sec" open>
      <summary>Exportar</summary>
      <div class="body">
        <div>
          <label for="fmt" class="note">Formato</label>
          <select id="fmt">
            <option value="screen">Do tamanho da tela (2×)</option>
            <option value="1920x1080">16:9 · Full HD 1920×1080</option>
            <option value="3840x2160" selected>16:9 · 4K 3840×2160</option>
            <option value="2160x2160">1:1 · 2160×2160</option>
            <option value="1080x1350">4:5 · Feed 1080×1350</option>
            <option value="1080x1920">9:16 · Stories 1080×1920</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="transp"> Fundo transparente (só PNG)</label>
        <button class="btn primary" id="pngBtn">Salvar imagem PNG</button>
        <div class="split">
          <div>
            <label for="dur" class="note">Volta completa</label>
            <select id="dur"><option value="6">6 s</option><option value="10" selected>10 s</option><option value="16">16 s</option></select>
          </div>
          <div>
            <label for="vres" class="note">Vídeo</label>
            <select id="vres"><option value="1920x1080">16:9 1080p</option><option value="1080x1080">1:1 1080</option><option value="1080x1920">9:16 1080</option></select>
          </div>
        </div>
        <button class="btn" id="vidBtn">Gravar giro 360°</button>
        <p class="status" id="status"></p>
      </div>
    </details>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

  if (g === geo) { if (geo.attributes.normal) geo.deleteAttribute('normal'); geo.computeVertexNormals(); }
  const c = g.attributes.color;
  if (c) { const a = c.array; for (let i = 0; i < a.length; i++) { let v = a[i]; if (v > 1) v /= 255; a[i] = v <= .04045 ? v/12.92 : Math.pow((v + .055)/1.055, 2.4); } c.needsUpdate = true; }
  return g;
}
function currentMat(){ return st.mode === 'pbr' ? pbrMat : matcapMat; }
function setModel(obj, name, isSample){
  if (model) { pivot.remove(model); model.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); }
  model = obj; let tris = 0, verts = 0; st.hasColor = false;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.material = currentMat(); o.castShadow = true; o.receiveShadow = true;
    const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count)/3; verts += g.attributes.position.count;
    if (g.attributes.color) st.hasColor = true;
  });
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3());
  const s = 2/Math.max(size.x, size.y, size.z);
  obj.scale.multiplyScalar(s);
  const b2 = new THREE.Box3().setFromObject(obj), c2 = b2.getCenter(new THREE.Vector3());
  obj.position.x -= c2.x; obj.position.z -= c2.z; obj.position.y -= b2.min.y;
  st.height = b2.max.y - b2.min.y;
  pbrMat.userData.u.uObjScale.value = obj.scale.x;
  center.position.set(0, st.height*0.5, 0);
  pivot.rotation.y = 0; pivot.add(obj);
  lights.forEach(updateLight);
  const fn = $('fileName'); fn.textContent = name;
  if (isSample) { const t = document.createElement('span'); t.className = 'sample-tag'; t.textContent = 'exemplo'; fn.append(' ', t); }
  st.name = name;
  $('stats').textContent = `${nf.format(Math.round(tris))} triângulos · ${nf.format(verts)} vértices`;
  $('ppWrap').hidden = !st.hasColor; $('pp').checked = st.hasColor; applyPolypaint();
  frameView(30);
}
function applyPolypaint(){
  const on = st.hasColor && $('pp').checked;
  [pbrMat, matcapMat].forEach(m => { if (m.vertexColors !== on) { m.vertexColors = on; m.needsUpdate = true; } });
}

/* ---------- Escultura de exemplo ---------- */
function sampleSculpture(){
  const sn = new THREE.SimplexNoise({random: (() => { let s = 7; return () => (s = (s*16807) % 2147483647)/2147483647; })()});
  let g = new THREE.IcosahedronGeometry(1, 72); g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = weld(g); const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    let f = 0, amp = .6, fr = 1.1;
    for (let o = 0; o < 3; o++) { f += sn.noise3d(v.x*fr + 3, v.y*fr, v.z*fr)*amp; amp *= .4; fr *= 2.0; }
    const ridge = 1 - Math.abs(sn.noise3d(v.x*1.8, v.y*1.8 + 9, v.z*1.8));
    const folds = Math.sin(v.y*7 + sn.noise3d(v.x*1.2, v.y*1.2, v.z*1.2)*2.5)*.012;
    const r = 1 + f*.13 + Math.pow(ridge, 8)*.06 + folds;
    p.setXYZ(i, v.x*r*.78, v.y*r*1.18, v.z*r*.82);
  }
  g.computeVertexNormals();
  const head = new THREE.Mesh(g); head.position.y = 2.05;
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(.5, .6, .55, 128, 1)); ped.position.y = .275;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.22, .34, .35, 96, 1)); neck.position.y = .65;
  const grp = new THREE.Group(); grp.add(ped, neck, head); return grp;
}

/* ================= Abrir arquivos ================= */
const busy = (on, msg, sub) => { $('busy').hidden = !on; if (msg) $('busyMsg').textContent = msg; $('busySub').textContent = sub || ''; };
const tick = () => new Promise(r => setTimeout(r, 40));
async function openFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['obj', 'ply', 'stl'].includes(ext)) { status(`O formato .${ext} não é aceito. Exporte do ZBrush em OBJ, PLY ou STL.`, 'warn'); return; }
  const mb = (file.size/1048576).toFixed(1).replace('.', ',');
  busy(true, 'Lendo arquivo…', `${file.name} · ${mb} MB`); await tick();
  try {
    let obj;
    if (ext === 'obj') {
      const txt = await file.text(); busy(true, 'Interpretando OBJ…', `${mb} MB`); await tick();
      obj = new THREE.OBJLoader().parse(txt);
      busy(true, 'Suavizando a malha…'); await tick();
      obj.traverse(o => { if (o.isMesh) { const g = o.geometry; if (g.attributes.normal) g.deleteAttribute('normal'); if (g.attributes.uv) g.deleteAttribute('uv'); o.geometry = prepGeometry(g); if (g !== o.geometry) g.dispose(); } });
    } else {
      const buf = await file.arrayBuffer(); busy(true, `Interpretando ${ext.toUpperCase()}…`); await tick();
      const g = ext === 'ply' ? new THREE.PLYLoader().parse(buf) : new THREE.STLLoader().parse(buf);
      busy(true, 'Suavizando a malha…'); await tick();
      if (g.attributes.uv) g.deleteAttribute('uv');
      const g2 = prepGeometry(g); if (g2 !== g) g.dispose();
      obj = new THREE.Mesh(g2);
    }
    setModel(obj, file.name.replace(/\.[^.]+$/, ''), false);
    status(`${file.name} aberto.`, 'ok');
  } catch (e) {
    console.error(e); status(`Não consegui ler ${file.name}. Se a malha for muito pesada, exporte em PLY binário ou reduza com o Decimation Master.`, 'warn');
  } finally { busy(false); }
}
$('openBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; };

stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; const f = e.dataTransfer.files[0]; if (f) openFile(f); });

(function pbrThumbs(){
  const S = 120, urls = {};
  let tr = null;
  try { tr = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); } catch (e) { tr = null; }
  if (tr) {
    tr.setSize(S, S); tr.outputEncoding = THREE.sRGBEncoding; tr.toneMapping = THREE.ACESFilmicToneMapping;
    const pm = new THREE.PMREMGenerator(tr); const env = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    const sc = new THREE.Scene(); sc.environment = env; sc.background = new THREE.Color(0x221f1a);
    const cam = new THREE.PerspectiveCamera(30, 1, .1, 10); cam.position.set(0, 0, 4.1);
    const k = new THREE.DirectionalLight(0xfff1df, 2.4); k.position.set(-2, 2.5, 2.5); sc.add(k);
    const r = new THREE.DirectionalLight(0xffffff, 1.6); r.position.set(1.5, 1, -3); sc.add(r);
    const geo = new THREE.SphereGeometry(1, 64, 48); const mesh = new THREE.Mesh(geo); sc.add(mesh);
    cam.updateMatrixWorld(); mesh.updateMatrixWorld();
    for (const p of PBR) {
      const m = makePbr(p); m.envMapIntensity = .6; m.userData.u.uObjScale.value = 1.6;
      mv.multiplyMatrices(cam.matrixWorldInverse, mesh.matrixWorld); m.userData.u.uNM.value.getNormalMatrix(mv);
      mesh.material = m; tr.render(sc, cam); urls[p.id] = tr.domElement.toDataURL('image/png'); m.dispose();
    }
    geo.dispose(); env.dispose(); pm.dispose(); tr.dispose(); try { tr.forceContextLoss(); } catch (e) {}
  }
  const groups = [...new Set(PBR.map(p => p.g))];
  for (const gname of groups) {
    const h = document.createElement('div'); h.className = 'sub'; h.textContent = gname;
    const grid = document.createElement('div'); grid.className = 'swatches';
    for (const p of PBR.filter(x => x.g === gname)) {
      let src = urls[p.id];
      if (!src) { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d'); x.fillStyle = p.color; x.fillRect(0, 0, 8, 8); src = c.toDataURL(); }
      grid.append(swatchBtn(p.id, p.nome, src));
    }
    $('swPbr').append(h, grid);
  }
})();

bind('envI', pct, v => { pbrMat.envMapIntensity = v; })();
$('showL').onchange = e => { st.showL = e.target.checked; helpers.visible = st.showL; };

const G = grade.uniforms;

  natural:{nome:'Natural', exp:1.05, con:1.04, sat:1, warm:0, bloom:.15, vig:.3, grain:.2},
  estudio:{nome:'Estúdio', exp:1.15, con:1.0, sat:.95, warm:-.1, bloom:.1, vig:.2, grain:.12},

const signed = v => (v > 0 ? '+' : '') + Math.round(v*100);

/* ================= Exportar ================= */
let downloads = null;
(async () => {
  try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
  if (!downloads) status('Salvar arquivos não está disponível nesta visualização. Abra a página no claude.ai.', 'warn');
})();
async function saveFile(filename, data){
  if (!downloads) { status('Salvar arquivos não está disponível nesta visualização.', 'warn'); return; }
  try { await downloads.save({filename, data}); status(`${filename} salvo.`, 'ok'); }
  catch (e) {
    const msgs = {declined:'Salvamento cancelado.', rate_limited:'Já há um pedido de salvamento aberto. Responda a ele e tente de novo.', too_large:'Arquivo grande demais. Escolha um formato menor.'};
    status(msgs[e && e.code] || 'Não foi possível salvar o arquivo aqui.', 'warn');
  }
}
const slug = () => (st.name || 'render').trim().replace(/\s+/g, '-').toLowerCase();
function parseSize(v){ return v === 'screen' ? [Math.round(stage.clientWidth*2), Math.round(stage.clientHeight*2)] : v.split('x').map(Number); }
function beginExport(transparent){ st.exporting = true; st.transparent = transparent; helpers.visible = false; if (transparent) scene.background = null; }
function endExport(){ st.exporting = false; st.transparent = false; scene.background = bgTex; helpers.visible = st.showL; fit(); }

$('pngBtn').onclick = () => {
  let [W, H] = parseSize($('fmt').value);
  const lim = Math.min(maxTex, 8192), fitS = Math.min(1, lim/Math.max(W, H)); W = Math.round(W*fitS); H = Math.round(H*fitS);
  const ss = Math.max(W, H)*2 <= lim && Math.max(W, H) <= 2200 ? 2 : 1;
  const transp = $('transp').checked;
  status('Renderizando…');
  requestAnimationFrame(() => {
    beginExport(transp);
    setSizes(W*ss, H*ss, 1); controls.update(); G.uTime.value = .37; draw();
    const out = document.createElement('canvas'); out.width = W; out.height = H; const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(canvas, 0, 0, W, H);
    endExport(); draw();
    out.toBlob(b => { if (b) saveFile(`lume-${slug()}-${W}x${H}.png`, b); else status('Falha ao gerar a imagem.', 'warn'); }, 'image/png');
  });
};

$('vidBtn').onclick = () => {
  if (st.recording) return;
  if (!window.MediaRecorder) { status('Este navegador não grava vídeo. Use o Chrome ou o Safari atualizados.', 'warn'); return; }
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)); if (!mime) { status('Nenhum formato de vídeo disponível neste navegador.', 'warn'); return; }
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const [W, H] = $('vres').value.split('x').map(Number), dur = +$('dur').value;
  const rec = document.createElement('canvas'); rec.width = W; rec.height = H; const rctx = rec.getContext('2d');
  const mr = new MediaRecorder(rec.captureStream(30), {mimeType: mime, videoBitsPerSecond: 16e6});
  const chunks = []; mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  st.recording = true; $('vidBtn').disabled = $('pngBtn').disabled = true;
  busy(true, 'Gravando giro 360°…', `${dur} s · ${W}×${H} · ${ext.toUpperCase()}`);
  const base = pivot.rotation.y; let t0 = null;
  beginExport(false);
  mr.onstop = () => {
    st.recording = false; $('vidBtn').disabled = $('pngBtn').disabled = false; busy(false);
    pivot.rotation.y = base; endExport();
    saveFile(`lume-giro-${slug()}-${W}x${H}.${ext}`, new Blob(chunks, {type: mime}));
  };
  mr.start(250);
  const step = now => {
    if (t0 === null) t0 = now;
    const t = Math.min(1, (now - t0)/(dur*1000));
    pivot.rotation.y = base + t*Math.PI*2;
    setSizes(W, H, 1); controls.update(); G.uTime.value = now/1000; draw();
    rctx.drawImage(canvas, 0, 0, W, H);
    $('busySub').textContent = `${Math.round(t*100)}% · ${W}×${H} · ${ext.toUpperCase()}`;
    if (t < 1) requestAnimationFrame(step); else setTimeout(() => mr.stop(), 120);
  };
  requestAnimationFrame(step);
};

/* ================= Início ================= */
new ResizeObserver(() => { if (!st.recording && !st.exporting) fit(); }).observe(stage);

let last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  if (st.recording) return;
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (st.spin) pivot.rotation.y += dt*0.5;
  G.uTime.value = now/1000;
  controls.update(); draw();
})(last);
})();
